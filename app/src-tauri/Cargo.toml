[package]
name = "holography-app"
version = "0.1.0"
description = "Photonic Lantern Digital Holography Control"
authors = ["UCF CREOL"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "holography_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
anyhow = "1"
once_cell = "1"
window-vibrancy = "0.6"

[features]
custom-protocol = ["tauri/custom-protocol"]
