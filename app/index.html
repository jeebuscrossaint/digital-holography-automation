<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Digital Holography</title>
    <style>
      /* Painted before any JS / CSS loads. Background is transparent so
         the native window backdrop (Mica / vibrancy) shows immediately;
         a solid fallback color sits on #root once React mounts. */
      html, body { margin: 0; height: 100%; background: transparent; }
    </style>
    <script>
      // Apply persisted theme before React mounts to avoid a one-frame flip.
      try {
        const saved = localStorage.getItem("theme");
        const sys   = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
        const t = saved === "light" || saved === "dark" ? saved : sys;
        document.documentElement.classList.toggle("dark",  t === "dark");
        document.documentElement.classList.toggle("light", t === "light");
      } catch {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
