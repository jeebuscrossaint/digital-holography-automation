hardware:
  laser:
    gpib_address: GPIB0::24::INSTR
    power_uw: 208
    power_unit: UW
  camera:
    url: cam://0
    calibration_file: ./hardware/calibration/XC-(10-06-2021)-500us_14931.xca
    exposure_time: 500
    model: Bobcat 320 GigE
    interface: GigE Vision (Ethernet-to-USB adapter)
  fiber_switch:
    port: COM3
    baudrate: 9600
    module: 1
  polarization_motors:
    serial_number: 38394984
    max_travel: 160
    initial_angles:
    - 0
    - 0
    - 0
experiment:
  legs:
  - 1
  - 2
  - 3
  - 4
  - 5
  - 6
  - 7
  wavelengths:
  - 1540
  - 1545
  - 1550
  - 1555
  - 1560
  - 1565
  - 1570
  wait_times:
    after_leg_switch: 1.0
    after_wavelength_change: 0.5
    after_polarization_adjust: 0.3
  fringe_detection:
    enabled: true
    min_visibility: 0.15
    max_attempts: 5
    check_method: variance
  polarization:
    auto_adjust: true
    search_method: grid
    angle_step: 10
    angle_range:
    - 0
    - 160
data:
  output_dir: ./holography_data
  filename_format: leg{leg:02d}-wavelength{wavelength:04d}.npy
  save_metadata: true
processing:
  image_size:
  - 640
  - 512
  crop_size: 100
  num_modes: 7
  core_radius: 25e-6
  numerical_aperture: 0.11
  effective_index: 1.453
  pixel_size: 70e-6
  quadratic_phase_correction: true
  phase_factor_range:
  - -2
  - 2
logging:
  level: INFO
  save_log_file: true
  log_file: ./experiment_log.txt
