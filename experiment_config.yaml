# Photonic Lantern Digital Holography — instrument addresses + sweep settings.
# Every key here is read by the code. If you add one, wire it up or leave it out;
# a knob that silently does nothing is worse than no knob.

hardware:
  laser:
    gpib_address: GPIB0::24::INSTR
    power_uw: 500
    power_unit: UW
  camera:
    url: cam://0?fg=XFrameGrabberNative
    calibration_file: ./hardware/calibration/XC-(10-06-2021)-500us_14931.xca
    exposure_time: 1000
    model: Bobcat 320 GigE
    interface: GigE Vision (Ethernet-to-USB adapter)
  fiber_switch:
    port: auto          # 'auto' (or a COMx hint) — the driver finds the switch wherever it enumerates
    baudrate: 9600
    module: 1
  polarization_motors:
    serial_number: 38394984
    max_travel: 160     # paddle range (deg); bounds the auto-optimizer sweep

experiment:
  legs: 1               # a list, a scalar, or {start, stop, step}
  wavelengths:
    start: 1525
    stop: 1530
    step: 1
  wait_times:
    after_leg_switch: 1.0
    after_wavelength_change: 0.5
    after_polarization_adjust: 0.3
  fringe_detection:
    enabled: false
    min_visibility: 200      # threshold on check_method's metric, not a 0-1 fraction
    max_attempts: 60         # frame budget for the optimizer
    check_method: sideband   # variance | michelson | fft_peaks | sideband | balance
  validation:
    saturation_level: 65535       # Bobcat 320 is Mono16
    max_saturated_fraction: 0.001 # above this the frame is flagged invalid
  polarization:
    angle_step: 10       # coarse sweep step (deg); a finer pass follows

data:
  output_dir: ./holography_collection_only/
  filename_format: leg{leg:02d}-wavelength{wavelength:04d}.npy
  save_metadata: true

processing:
  crop_size: 200        # window (px) kept around the beam; also the recon grid

  # --- single-frame LP basis (data_processing.py) ---
  # core_radius + numerical_aperture determine how many LP modes the basis has,
  # and that should match what the lantern physically supports (an N-port
  # lantern supports ~N modes). These values give 15 modes; the multiport block
  # below gives 8 for the same lantern. See CLAUDE.md, "Two open physics
  # questions" — resolving it is a call about which lantern is on the bench.
  core_radius: 1.7e-05
  numerical_aperture: 0.11
  effective_index: 1.453
  num_modes: 18         # cap only, and it never binds over this sweep. The basis
                        # size is set by core_radius/NA *and wavelength* (V goes
                        # as 1/lambda): 17 modes at 1525-1545 nm, 15 at 1550-1575,
                        # so the count is 15-17 and the cap is never reached.
                        # Raising this changes nothing; only core_radius/NA do.

  # --- multiport / cross-port LP basis (multiport_reconstruction.py) ---
  multiport:
    core_radius: 1.2e-05      # 7-port lantern -> 8 modes
    numerical_aperture: 0.11
    effective_index: 1.453

  # Quadratic-phase (defocus) scan, optimized per frame.
  phase_factor_range: [-3.0, 3.0]
  phase_factor_step: 0.5

  # Background = the reference beam alone, one frame per wavelength. Matched by
  # nearest wavelength (within 2 nm). Silently skipped if background_dir is
  # missing, so check the path if subtraction seems to do nothing.
  subtract_background: true
  background_dir: ./holography_data/references
  background_modifier: 0.8

logging:
  level: INFO
  save_log_file: true
  log_file: ./experiment_log.txt
