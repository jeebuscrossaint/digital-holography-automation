hardware:
  laser:
    gpib_address: GPIB0::24::INSTR
    power_uw: 500
    power_unit: UW
  camera:
    url: cam://0?fg=XFrameGrabberNative
    calibration_file: ./hardware/calibration/XC-(10-06-2021)-500us_14931.xca
    exposure_time: 1000
    model: Bobcat 320 GigE
    interface: GigE Vision (Ethernet-to-USB adapter)
  fiber_switch:
    port: COM4
    baudrate: 9600
    module: 1
  polarization_motors:
    serial_number: 38394984
    max_travel: 160
    initial_angles:
    - 0
    - 0
    - 0
experiment:
  legs: 1
  wavelengths:
    start: 1525
    stop: 1530
    step: 1
  wait_times:
    after_leg_switch: 1.0
    after_wavelength_change: 0.5
    after_polarization_adjust: 0.3
  fringe_detection:
    enabled: false
    min_visibility: 200
    max_attempts: 60
    check_method: sideband
  validation:
    saturation_level: 65535
    max_saturated_fraction: 0.001
  polarization:
    auto_adjust: true
    search_method: grid
    angle_step: 10
    angle_range:
    - 0
    - 160
data:
  output_dir: ./holography_collection_only/
  filename_format: leg{leg:02d}-wavelength{wavelength:04d}.npy
  save_metadata: true
processing:
  image_size:
  - 320
  - 256
  crop_size: 200
  num_modes: 18
  subtract_background: true
  background_dir: ./holography_data/references
  background_modifier: 0.8
  core_radius: 1.7e-05
  numerical_aperture: 0.11
  effective_index: 1.453
  pixel_size: 7.0e-05
  quadratic_phase_correction: true
  phase_factor_range:
  - -2
  - 2
logging:
  level: INFO
  save_log_file: true
  log_file: ./experiment_log.txt
