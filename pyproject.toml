[project]
name = "digital-holography-automation"
version = "0.2.0"
description = "Photonic Lantern Digital Holography Automation — UCF CREOL"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "gpib-ctypes>=0.3.0",
    "matplotlib>=3.10.8",
    "numpy>=2.4.2",
    "pillow>=8.0.0",
    "pyserial>=3.5",
    "pyside6>=6.11.0",
    "pyvisa>=1.11.0",
    "pyvisa-py>=0.5.0",
    "pyyaml>=6.0.3",
    "scipy>=1.17.1",
]

[project.scripts]
holo = "holo.cli:main"

[dependency-groups]
dev = [
    "pyinstaller>=6.20.0",
    "pytest>=8.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# holo/ is the library; gui/ is a front end over it and ships alongside.
packages = ["holo", "gui"]

[tool.hatch.build.targets.wheel.force-include]
"experiment_config.yaml" = "holo/experiment_config.yaml"

[tool.pytest.ini_options]
testpaths = ["tests"]
